name: CI

# Runs the test suites on every push / pull request to the long-lived branches.
# The release workflow (release.yml) also runs these, but only at release time —
# this gives per-PR feedback so regressions are caught before merge.

on:
  push:
    branches:
      - "v5/dev"
      - "v5/main"
      - "v6/dev"
      - "v6/main"
      - "v7/dev"
      - "v7/main"
  pull_request:
    branches:
      - "v5/dev"
      - "v5/main"
      - "v6/dev"
      - "v6/main"
      - "v7/dev"
      - "v7/main"
  workflow_dispatch:

# Least-privilege token: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-dotnet-

    - name: Setup .NET
      uses: actions/setup-dotnet@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'
        cache-dependency-path: src/Umbraco.Community.BlockPreview.UI/package-lock.json

    # Build the backoffice (Lit/Vite) assets first — the .csproj assumes the
    # client assets are already built.
    - name: Build frontend assets
      working-directory: src/Umbraco.Community.BlockPreview.UI
      run: |
        npm ci
        npm run build

    - name: Install Playwright browser (for frontend tests)
      working-directory: src/Umbraco.Community.BlockPreview.UI
      run: npx playwright install chromium

    - name: Run frontend tests
      working-directory: src/Umbraco.Community.BlockPreview.UI
      run: npm test

    - name: Build project
      run: dotnet build src\Umbraco.Community.BlockPreview\Umbraco.Community.BlockPreview.csproj --configuration Release

    - name: Run .NET tests
      run: dotnet test tests\Umbraco.Community.BlockPreview.Tests\Umbraco.Community.BlockPreview.Tests.csproj --configuration Release --verbosity normal
